[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intelligate"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.5",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.10.3",
  "pydantic-settings==2.6.1",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "asyncpg==0.30.0",
  "psycopg2-binary==2.9.10",
  "httpx==0.28.0",
  "redis==5.2.1",
  "cryptography==44.0.0",
  "passlib[bcrypt]==1.7.4",
  "python-jose[cryptography]==3.3.0",
  "tiktoken==0.8.0",
  "presidio-analyzer==2.2.355",
  "presidio-anonymizer==2.2.355",
  "spacy==3.8.3",
  "opentelemetry-sdk==1.29.0",
  "opentelemetry-instrumentation-fastapi==0.50b0",
  "prometheus-client==0.21.1",
  "structlog==24.4.0",
  "python-multipart==0.0.20",
  "python-dotenv==1.0.1",
  "anyio==4.7.0",
  "tenacity==9.0.0",
  "cachetools==5.5.0",
  "msgpack==1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "pytest-cov==6.0.0",
  "httpx==0.28.0",
  "factory-boy==3.3.1",
  "faker==33.1.0",
  "locust==2.32.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
